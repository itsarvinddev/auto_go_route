name: auto_go_route_generator
version: 2.0.0
description: >-
  Code generator for auto_go_route. Turns route annotations into type-safe
  go_router routes, typed URL builders and navigation extensions.

homepage: https://github.com/itsarvinddev/auto_go_route
repository: https://github.com/itsarvinddev/auto_go_route
issue_tracker: https://github.com/itsarvinddev/auto_go_route/issues

topics:
  - codegen
  - build-runner
  - routing
  - go-router
  - navigation

funding:
  - https://github.com/sponsors/itsarvinddev

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  # The analyzer range is deliberately wide: pub always picks the newest
  # analyzer the user's SDK allows, and that is what keeps the generator able
  # to parse new Dart language versions. Pinning it is what caused issue #3.
  #
  # The floors are load-bearing, not decorative:
  #  * analyzer >= 8.2.0 — the unified element model (`ClassElement`,
  #    `Element.library`); `DartType.element` is @experimental before it, and
  #    `element2.dart` is deleted at 9.0.0;
  #  * build >= 4.0.2 — `Resolver.libraryFor` returns a `LibraryElement`;
  #  * source_gen >= 4.1.1 — `TypeChecker.typeNamedLiterally`, which every
  #    annotation checker uses, first appears there (verified: 4.0.1 does not
  #    compile the generator; 4.1.1 with analyzer 8.2.0 and build 4.0.2 does).
  analyzer: ">=8.2.0 <15.0.0"
  build: ">=4.0.2 <5.0.0"
  source_gen: ">=4.1.1 <5.0.0"
  # 2.2.0 is the first release where `**/` also matches zero directories.
  # Under 2.1.3, `lib/**/*.dart` skipped every file directly in `lib/`, so
  # routes declared there were silently missing from the table.
  glob: ^2.2.0

dev_dependencies:
  build_runner: ^2.16.1
  build_test: ^3.5.20
  lints: ^6.0.0
  logging: ^1.0.0
  pub_semver: ^2.1.0
  test: ^1.32.0
