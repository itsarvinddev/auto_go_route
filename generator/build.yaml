builders:
  auto_go_route_builder:
    import: "package:auto_go_route_generator/builder.dart"
    builder_factories: ["autoGoRouteBuilder"]
    build_extensions:
      ".dart": [".routes.g.dart"]
    auto_apply: dependents
    # `part` files must sit next to the library they belong to.
    build_to: source
    # NO `required_inputs`. This builder reads unprocessed Dart source, and an
    # entry that is a *suffix* of anything this package emits creates a build
    # plan cycle. `.routes.g.dart` ends with both `.dart` and `.g.dart`, so
    # both are permanently off-limits. 1.x declared `required_inputs: [".dart"]`,
    # which forced this builder to wait behind every other Dart generator and
    # dragged generated libraries into its own annotation scan.
    defaults:
      generate_for:
        include:
          - lib/**
          - test/**
