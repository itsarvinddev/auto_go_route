include: package:flutter_lints/flutter.yaml

analyzer:
  # Both nested packages have their own analysis_options.yaml and dependencies.
  # Without their own `pub get`, analyzing from the root would resolve them
  # against this package and report every generator import as missing.
  exclude:
    - build/**
    - example/**
    - generator/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # `auto_go_route` is a published library, so every public member is
    # documentation the reader will actually hit.
    - public_member_api_docs
    - prefer_single_quotes
    - unawaited_futures
    - avoid_print
